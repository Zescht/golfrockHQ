<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Italian Regions — Map Quiz</title>
    <link rel="stylesheet" href="./assets/leaflet.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="italian-regions">
    <header class="site-header">
      <a class="brand" href="#quiz" aria-label="GolfRock Headquarter">
        <span class="brand-bars" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>GolfRock Headquarter</span>
      </a>
      <nav class="quiz-selector" id="quiz-selector" aria-label="Quiz selection">
        <a id="porsche-quiz-link" href="../porsche/?lang=en">Porsche Centre</a>
        <a id="italy-quiz-link" class="active" href="../italian-regions/?lang=en" aria-current="page">Italian Regions</a>
      </nav>
      <div class="language-menu">
        <label class="sr-only" id="language-label" for="language-select">Language</label>
        <select id="language-select" aria-labelledby="language-label">
          <option value="en">EN</option>
          <option value="de">DE</option>
        </select>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title"><span id="title-line-1">Italian Regions</span></h1>
        <p id="intro-text">Name all 20 regions of Italy. Each region counts once.</p>
      </section>

      <section class="quiz" id="quiz" aria-labelledby="page-title">
        <div class="game-controls">
          <div class="interaction-area">
            <button class="start-button" id="start-button" type="button" disabled>
              <span id="start-button-label">LOADING MAP…</span>
            </button>

            <form id="answer-form" class="answer-form" autocomplete="off" hidden>
              <label id="answer-label" for="answer-input">Enter Regions:</label>
              <input
                id="answer-input"
                name="answer"
                type="text"
                spellcheck="false"
                autocapitalize="words"
                aria-describedby="answer-help"
                disabled
              />
              <span class="sr-only" id="answer-help">
                Correct region names are accepted automatically. Incorrect answers receive no response.
              </span>
            </form>
          </div>

          <div class="counter score-counter" aria-live="polite" aria-atomic="true">
            <span id="score-label">POINTS</span>
            <strong id="score">0/20</strong>
          </div>

          <div class="counter timer-counter">
            <span id="timer-label">TIMER</span>
            <strong id="timer">05:00</strong>
            <button class="give-up-button" id="give-up-button" type="button" hidden disabled>
              Give up
            </button>
          </div>
        </div>

        <div class="map-frame italy-map-frame">
          <div
            id="world-map"
            role="img"
            aria-label="Map of Italy divided into its 20 regions. Correct answers are highlighted."
          ></div>
          <div class="map-loading" id="map-loading">Loading Italy map…</div>
        </div>

        <div class="completion-bar" id="completion-bar" hidden>
          <p id="completion-message"></p>
          <button id="restart-button" type="button">Play again</button>
        </div>
      </section>
    </main>

    <script src="./assets/leaflet.js"></script>
    <script src="./app.js" type="module"></script>
  </body>
</html>
